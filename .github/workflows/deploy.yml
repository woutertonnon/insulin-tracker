name: Deploy to TestFlight

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-14
    env:
      # ---- must match Config.xcconfig ----
      DEVELOPMENT_TEAM: ${{ vars.DEVELOPMENT_TEAM }}
      APP_IDENTIFIER_IOS: ${{ vars.APP_IDENTIFIER_IOS }}
      APP_IDENTIFIER_WATCH: ${{ vars.APP_IDENTIFIER_WATCH }}
      # ---- App Store Connect API key ----
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.1"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Write App Store Connect API key to disk
        run: |
          echo "$ASC_KEY_CONTENT" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Cache bundler
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: gems-${{ hashFiles('Gemfile.lock', 'Gemfile') }}
          restore-keys: gems-

      - name: Install fastlane
        run: |
          bundle config path vendor/bundle
          bundle install --jobs 4 --retry 3

      - name: Build & upload to TestFlight
        run: bundle exec fastlane beta

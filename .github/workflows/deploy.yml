name: Deploy to TestFlight

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    env:
      # ---- must match Config.xcconfig ----
      DEVELOPMENT_TEAM: ${{ vars.DEVELOPMENT_TEAM }}
      APP_IDENTIFIER_IOS: ${{ vars.APP_IDENTIFIER_IOS }}
      APP_IDENTIFIER_WATCH: ${{ vars.APP_IDENTIFIER_WATCH }}
      # ---- App Store Connect API key ----
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      # ---- fastlane match (certs on the `certs` branch of this repo) ----
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_URL: ${{ github.server_url }}/${{ github.repository }}.git
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.1"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Prepare match git auth
        run: |
          AUTH=$(printf 'x-access-token:%s' "${{ github.token }}" | base64 | tr -d '\n')
          echo "MATCH_GIT_BASIC_AUTHORIZATION=$AUTH" >> "$GITHUB_ENV"

      - name: Cache bundler
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: gems-${{ hashFiles('Gemfile.lock', 'Gemfile') }}
          restore-keys: gems-

      - name: Install fastlane
        run: |
          bundle config path vendor/bundle
          bundle install --jobs 4 --retry 3

      - name: Build & upload to TestFlight
        run: bundle exec fastlane beta

name: InsulinTracker

options:
  bundleIdPrefix: com.insulintracker
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top

# Central config (team id + bundle ids) applied to every target & config.
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  # ---------------------------------------------------------------- iOS app
  InsulinTracker-iOS:
    type: application
    platform: iOS
    sources:
      - path: iOSApp
      - path: Shared
    info:
      path: iOSApp/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(IOS_APP_BUNDLE_ID)
        PRODUCT_NAME: Insulin
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: InsulinTracker-Watch
        embed: true

  # -------------------------------------------------------------- watch app
  InsulinTracker-Watch:
    type: application
    platform: watchOS
    sources:
      - path: WatchApp
      - path: Shared
    info:
      path: WatchApp/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WATCH_APP_BUNDLE_ID)
        PRODUCT_NAME: Insulin
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO

schemes:
  InsulinTracker-iOS:
    build:
      targets:
        InsulinTracker-iOS: all
    archive:
      config: Release
    run:
      config: Debug
